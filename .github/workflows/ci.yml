name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        dependencies: [pinned, latest]
    name: test (py${{ matrix.python-version }}, ${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (pinned = constraints.txt)
        if: matrix.dependencies == 'pinned'
        run: pip install -e ".[azure,foundry,dev]" -c constraints.txt
      - name: Install (latest releases)
        if: matrix.dependencies == 'latest'
        run: pip install --upgrade -e ".[azure,foundry,dev]"
      - run: pip list | grep -i agent-framework
      - run: pytest -v
